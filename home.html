---
layout: default
---
<h1>{{ page.title | default: site.title }}</h1>

<ul class="post-list">
  {% for post in site.posts reversed %}
    <li>
      <span class="post-meta">{{ post.date | date: "%b %-d, %Y" }}</span>
      <h2>
        <a class="post-link" href="{{ post.url | relative_url }}">{{ post.title }}</a>
      </h2>
    </li>
  {% endfor %}
</ul>
